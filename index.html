<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sun Reminder</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, Helvetica, sans-serif;
            background: transparent;
        }

        .sun-card {
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .sun-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .widget-container {
            width: 680px;
            height: 1200px;
            margin: 0 auto;
            overflow: hidden;
        }

        .widget-container iframe {
            width: 170px;
            height: 300px;
            border: 0;
            transform: scale(4);
            transform-origin: top left;
        }

        .sun-message {
            margin-top: 30px;
            font-size: 32px;
            font-weight: bold;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="sun-card">

        <div class="sun-title">
            ☀️ SUN REMINDER
        </div>

        <div class="widget-container">
            <iframe
                src="https://www.sunsmart.com.au/uvalert/widget.aspx?locationid=140"
                scrolling="no">
            </iframe>
        </div>

        <div class="sun-message">
            If the UV index is 3 or above,<br>
            remember to<br><br>

            ☀️ SLIP • SLOP • SLAP • SEEK • SLIDE ☀️
        </div>

    </div>

</body>
</html>
